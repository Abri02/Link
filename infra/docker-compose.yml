services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: link
      POSTGRES_USER: link
      POSTGRES_PASSWORD: link
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U link -d link"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
