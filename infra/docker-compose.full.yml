services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: link
      POSTGRES_USER: link
      POSTGRES_PASSWORD: link
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U link -d link"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/link
      SPRING_DATASOURCE_USERNAME: link
      SPRING_DATASOURCE_PASSWORD: link
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  user-service:
    build:
      context: ../Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/link
      SPRING_DATASOURCE_USERNAME: link
      SPRING_DATASOURCE_PASSWORD: link
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8082'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  messaging-service:
    build:
      context: ../Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: messaging-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/link
      SPRING_DATASOURCE_USERNAME: link
      SPRING_DATASOURCE_PASSWORD: link
      AUTHSERVICE_URL: http://auth-service:8081
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8083'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  file-service:
    build:
      context: ../Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: file-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/link
      SPRING_DATASOURCE_USERNAME: link
      SPRING_DATASOURCE_PASSWORD: link
      MINIO_URL: http://minio:9000
      MESSAGING_URL: http://messaging-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8084'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  payment-service:
    build:
      context: ../Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/link
      SPRING_DATASOURCE_USERNAME: link
      SPRING_DATASOURCE_PASSWORD: link
      MESSAGING_URL: http://messaging-service:8083
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8085'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  gateway:
    build:
      context: ../Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
