name: messaging-service tests

on:
  push:
    paths:
      - "Link-BE/messaging-service/**"
      - "Link-BE/shared-jwt/**"
      - "Link-BE/build.gradle.kts"
      - "Link-BE/settings.gradle.kts"
  pull_request:
    paths:
      - "Link-BE/messaging-service/**"
      - "Link-BE/shared-jwt/**"
      - "Link-BE/build.gradle.kts"
      - "Link-BE/settings.gradle.kts"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle

      - name: Run messaging-service unit tests
        working-directory: Link-BE
        run: ./gradlew :messaging-service:test --no-daemon

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messaging-service-test-report
          path: Link-BE/messaging-service/build/reports/tests/test/
          retention-days: 7
