name: auth-service tests

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "Link-BE/auth-service/**"
      - "Link-BE/shared-jwt/**"
      - "Link-BE/build.gradle.kts"
      - "Link-BE/settings.gradle.kts"
  pull_request:
    branches: [main]
    paths:
      - "Link-BE/auth-service/**"
      - "Link-BE/shared-jwt/**"
      - "Link-BE/build.gradle.kts"
      - "Link-BE/settings.gradle.kts"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle

      - name: Run auth-service unit tests
        working-directory: Link-BE
        run: ./gradlew :auth-service:test --no-daemon

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-service-test-report
          path: Link-BE/auth-service/build/reports/tests/test/
          retention-days: 7
