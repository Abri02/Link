name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: link
          POSTGRES_USER: link
          POSTGRES_PASSWORD: link
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle

      # ── Node ──────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Link-FE/package-lock.json

      # ── Playwright browser cache ───────────────────────────────────────
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('Link-FE/package-lock.json') }}

      # ── MinIO ─────────────────────────────────────────────────────────
      # minio/minio is no longer pullable from Docker Hub; pgsty/minio is a drop-in build.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done

      # ── Database schema ───────────────────────────────────────────────
      - name: Apply DB schema
        run: psql -h localhost -U link -d link -f infra/postgres/init.sql
        env:
          PGPASSWORD: link

      # ── Backend ───────────────────────────────────────────────────────
      - name: Build backend (skip tests)
        working-directory: Link-BE
        run: ./gradlew :auth-service:bootJar :user-service:bootJar :messaging-service:bootJar :file-service:bootJar :gateway:bootJar -x test --no-daemon

      - name: Start auth-service
        run: |
          JAR=$(find Link-BE/auth-service/build/libs -name "*.jar" ! -name "*-plain.jar" | head -1)
          java -jar "$JAR" >> /tmp/auth-service.log 2>&1 &
          echo $! > /tmp/auth-service.pid

      - name: Start user-service
        run: |
          JAR=$(find Link-BE/user-service/build/libs -name "*.jar" ! -name "*-plain.jar" | head -1)
          java -jar "$JAR" >> /tmp/user-service.log 2>&1 &
          echo $! > /tmp/user-service.pid

      - name: Start messaging-service
        run: |
          JAR=$(find Link-BE/messaging-service/build/libs -name "*.jar" ! -name "*-plain.jar" | head -1)
          java -jar "$JAR" >> /tmp/messaging-service.log 2>&1 &
          echo $! > /tmp/messaging-service.pid

      - name: Start file-service
        run: |
          JAR=$(find Link-BE/file-service/build/libs -name "*.jar" ! -name "*-plain.jar" | head -1)
          java -jar "$JAR" >> /tmp/file-service.log 2>&1 &
          echo $! > /tmp/file-service.pid

      - name: Start gateway
        run: |
          JAR=$(find Link-BE/gateway/build/libs -name "*.jar" ! -name "*-plain.jar" | head -1)
          java -jar "$JAR" >> /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid

      - name: Wait for all services to accept connections
        run: |
          wait_for_port() {
            local port=$1
            local name=$2
            echo "Waiting for $name on :$port (up to 120 s)..."
            for i in $(seq 1 40); do
              if nc -z localhost "$port" 2>/dev/null; then
                echo "$name is up after $((i * 3)) s."
                return 0
              fi
              echo "  [${i}/40] $name not ready yet..."
              sleep 3
            done
            echo "::error::$name did not start within 120 s."
            return 1
          }

          wait_for_port 8081 auth-service    || { cat /tmp/auth-service.log;    exit 1; }
          wait_for_port 8082 user-service    || { cat /tmp/user-service.log;    exit 1; }
          wait_for_port 8083 messaging-service || { cat /tmp/messaging-service.log; exit 1; }
          wait_for_port 8084 file-service    || { cat /tmp/file-service.log;    exit 1; }
          wait_for_port 8080 gateway         || {
            echo "=== auth-service ===" && cat /tmp/auth-service.log || true
            echo "=== user-service ===" && cat /tmp/user-service.log || true
            echo "=== messaging-service ===" && cat /tmp/messaging-service.log || true
            echo "=== file-service ===" && cat /tmp/file-service.log || true
            echo "=== gateway ===" && cat /tmp/gateway.log || true
            exit 1
          }

      # ── Frontend & tests ──────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: Link-FE
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Link-FE
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit)
        working-directory: Link-FE
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: Link-FE
        run: npx playwright test

      # ── Artifacts ─────────────────────────────────────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Link-FE/playwright-report/
          retention-days: 14

      - name: Upload service logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: service-logs
          path: |
            /tmp/auth-service.log
            /tmp/user-service.log
            /tmp/messaging-service.log
            /tmp/file-service.log
            /tmp/gateway.log
          retention-days: 3
