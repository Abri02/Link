spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/link
spring.datasource.username=link
spring.datasource.password=link

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=auth

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
