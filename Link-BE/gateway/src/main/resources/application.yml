spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Auth service — strip /api prefix before forwarding.
            # e.g. /api/auth/login → auth-service:8081/auth/login
            - id: auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            # User service
            - id: users
              uri: http://localhost:8082
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            # File service — must be before the messaging catch-all
            - id: files
              uri: http://localhost:8084
              predicates:
                - Path=/api/attachments,/api/attachments/**
              filters:
                - StripPrefix=1

            # Payment service — must be before the messaging catch-all
            - id: payments
              uri: http://localhost:8085
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1

            # Messaging service — catch-all for remaining /api/** paths
            - id: messaging
              uri: http://localhost:8083
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1

server:
  port: 8080
