spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: users
              uri: http://user-service:8082
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            # File service - must be before the messaging catch-all
            - id: files
              uri: http://file-service:8084
              predicates:
                - Path=/api/attachments,/api/attachments/**
              filters:
                - StripPrefix=1
            # Payment service - must be before the messaging catch-all
            - id: payments
              uri: http://payment-service:8085
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
            - id: messaging
              uri: http://messaging-service:8083
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1
