spring.application.name=file-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/link
spring.datasource.username=link
spring.datasource.password=link

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=files

spring.flyway.enabled=false

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=link-files

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
