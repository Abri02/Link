spring.application.name=payment-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/link
spring.datasource.username=link
spring.datasource.password=link

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=payments

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

# Used to check the caller's workspace role with their JWT
messaging.url=${MESSAGING_URL:http://localhost:8083}

# Where Stripe sends the browser back to
link.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Stripe test-mode credentials. Never commit real values. Unset means billing returns 503.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.price-id=${STRIPE_PRICE_ID:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Shared with messaging-service for the internal plan update. Unset means the update is refused.
link.internal.service-token=${INTERNAL_SERVICE_TOKEN:}
