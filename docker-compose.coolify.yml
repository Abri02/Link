# Coolify deploys from the repo root, so every relative path here is
# resolved against the repo root (NOT against this file's folder).
# Keep infra/docker-compose.full.yml for local `cd infra && docker compose` use.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: link
      POSTGRES_USER: link
      POSTGRES_PASSWORD: link
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U link -d link"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/link
      SPRING_DATASOURCE_USERNAME: link
      SPRING_DATASOURCE_PASSWORD: link
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  user-service:
    build:
      context: ./Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/link
      SPRING_DATASOURCE_USERNAME: link
      SPRING_DATASOURCE_PASSWORD: link
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8082'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  messaging-service:
    build:
      context: ./Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: messaging-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/link
      SPRING_DATASOURCE_USERNAME: link
      SPRING_DATASOURCE_PASSWORD: link
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8083'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  gateway:
    build:
      context: ./Link-BE
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy

volumes:
  postgres_data:
